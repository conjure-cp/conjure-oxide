# SAT acceptance verified with TEST_CASE_TIMEOUT=120.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "z3", "sat"]
skip-conjure-validation = "Conjure does not support :: for type aannotations"
number-of-solutions = 100
channelling = "uniform"
heuristic = "x"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
