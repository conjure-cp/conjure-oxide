# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
skip-conjure-validation = "First solutions do not agree and I don't want to enumerate all solutions."
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "skip"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
