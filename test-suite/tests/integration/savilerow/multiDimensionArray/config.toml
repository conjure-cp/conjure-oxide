# SAT uses compact: enumerating every SAT modelling choice is too slow for this fixture.
skip-conjure-validation = "First solutions do not agree and I don't want to enumerate all solutions."
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "skip"
rule-trace = "aggregate"

[solver-options.sat]
heuristic = "c"
channelling = "uniform"
