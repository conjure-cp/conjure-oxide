skip = "Conjure does not support tableshort"
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
skip-conjure-validation = "Conjure does not support tableshort"
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
