parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
skip-conjure-validation = "Conjure does not support Oxide shortTable; original wildcard rows independently enumerate to 6 solutions."
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
