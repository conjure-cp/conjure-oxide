# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
skip = "Rewriting is too slow for this parameter: about 33 seconds per step, so over 15 minutes for the 31 steps asked for here"
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
