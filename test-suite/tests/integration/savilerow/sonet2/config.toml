# SAT uses compact: enumerating every SAT modelling choice is too slow for this fixture.
# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = 1
rule-trace = "aggregate"

[solver-options.sat]
heuristic = "c"
channelling = "uniform"
