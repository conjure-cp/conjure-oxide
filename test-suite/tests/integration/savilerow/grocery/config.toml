parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "native"
solver = "minion"
# Minion rejects product constraints whose bound magnitude exceeds its limit
# (same failure as Conjure+Savile Row on this model; see input.essence comments).
skip = "Minion product domain bounds too large"
skip-conjure-validation = "Int domain too large for minion"
number-of-solutions = 1
