parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
skip = "Minion product domain bounds too large"
skip-conjure-validation = "Int domain too large for minion"
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
