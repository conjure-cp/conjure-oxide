# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = 1

# Uniform SAT objective portfolios; the parameter instance has optimum 11.
channelling = "uniform"
heuristic = "x"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
