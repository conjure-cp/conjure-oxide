# Imported from Conjure tests/exhaustive/basic/function_complex_01.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = "minion"
number-of-solutions = "all"
# Oxide and Conjure find the same six functions here, but print the entries of each one in a
# different order: Oxide orders set-valued keys by `set_essence_cmp`, a subset-flavoured
# comparison ({(7,false)} < {(7,true)} < {(7,false),(7,true)}), where Conjure orders them
# lexicographically on the sorted elements ({(7,false)} < {(7,false),(7,true)} < {(7,true)}).
# Reconciling those is a change to canonical set ordering, which packed encodings and domain
# enumeration also depend on, so the solutions are compared against this model's own
# recording rather than against Conjure.
skip-conjure-validation = "Oxide and Conjure order set-valued function keys differently"
