# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# SAT acceptance verified with TEST_CASE_TIMEOUT=120.
# Hand-authored campaign verification case (Conjure's tests/exhaustive/basic/function_total_bool_01,
# reused early as a smoke test since it needs no horizontal rules — just correct structural
# representation of a small total function).
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "sat"]
number-of-solutions = "all"
channelling = "uniform"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
