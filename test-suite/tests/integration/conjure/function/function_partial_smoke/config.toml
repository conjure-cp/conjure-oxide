# Hand-authored campaign verification case: a small sparse partial function (maxSize 2 out of a
# 10-element domain), exercising FunctionAsRelation end to end (relation channelling ->
# RelationAsSet -> Set-of-tuple representation selection, plus the hand-built "no duplicate
