# Hand-authored campaign verification case (not imported from Conjure's exhaustive suite):
# variable-length injective sequence, exercising the guarded-pairwise structural constraint
# (padding can coincide with a legitimately active value, so this must not use a value-based
# allDifferentExcept). Expected: sum over length 0..2 of permutations(3, length) = 1+3+6 = 10.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "native"
heuristic = "x"
solver = "minion"
number-of-solutions = "all"
