# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Hand-authored campaign verification case (not imported from Conjure's exhaustive suite):
# surjective sequence, exercising the total-inverse-lookup structural constraint.
# Expected: 2^3 - 2 = 6 (all length-3 sequences over a 2-element domain, minus the two
# constant ones that miss a domain value).
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "z3", "sat"]
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
