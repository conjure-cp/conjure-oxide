
# Imported from Conjure tests/exhaustive/basic/sequence_empty_02 (second of three commented
# variants in seq.essence: a find equated to the empty sequence literal).
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "z3", "sat"]
number-of-solutions = "all"
channelling = "uniform"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
