# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Hand-authored campaign verification case (not imported from Conjure's exhaustive suite):
# fixed-length injective sequence, exercising the plain allDiff structural constraint.
# Expected: 3*2 = 6 solutions (permutations of size 2 from a 3-element domain).
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "z3", "sat"]
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
