# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Imported from Conjure tests/exhaustive/basic/reflexive_rel/reflexive_rel.essence.
# Deferred during the relation representation step (needed the AttributeAsConstraint mechanism,
# implemented in a later step); imported once that mechanism landed.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "sat"]
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
