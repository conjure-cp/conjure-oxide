# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Imported from Conjure tests/exhaustive/basic/setOfSet01/setOfSet01.essence.
# Artefacts recorded with TEST_CASE_TIMEOUT=120.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "all"
channelling = "uniform"
heuristic = "x"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
