# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Imported from Conjure tests/exhaustive/basic/cut_01_off.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "sat"]
number-of-solutions = "all"
channelling = "uniform"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
