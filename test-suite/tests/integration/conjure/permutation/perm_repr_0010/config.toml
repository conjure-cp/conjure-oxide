# Imported from Conjure tests/exhaustive/basic/perms/01_representation/int/0010_find_permutation_maxSize_2_of_int1_3.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
# PermutationAsFunction channels a permutation through Function-typed auxiliaries, so every
# representation choice (`heuristic = "x"`) includes FunctionAsRelation for them. A relation of
# decision-variable tuples is a poor fit for the total, bijective functions a permutation needs:
# the search is over sets of pairs, with only pairwise well-formedness to prune it, and every
# permutation case here slowed by five- to twenty-fold under it. Take the compact choice
# instead -- `basic/function/sparse-partial` keeps FunctionAsRelation covered on a domain that
# suits it.
heuristic = "x"
solver = "minion"
number-of-solutions = "all"
