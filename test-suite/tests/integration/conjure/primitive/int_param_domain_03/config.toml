# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# SAT acceptance verified with TEST_CASE_TIMEOUT=120.
# Imported from Conjure tests/exhaustive/basic/int_param_domain_03.
# Artefacts recorded with TEST_CASE_TIMEOUT=120.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "z3", "sat"]
number-of-solutions = "all"
channelling = "uniform"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
