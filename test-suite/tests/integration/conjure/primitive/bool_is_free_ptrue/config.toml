# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Imported from Conjure tests/exhaustive/basic/bool_is_free2 + param000002.param.
# Artefacts recorded with TEST_CASE_TIMEOUT=120.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["minion", "sat", "z3"]
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
