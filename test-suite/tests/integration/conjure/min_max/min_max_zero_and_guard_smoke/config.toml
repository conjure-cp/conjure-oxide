# Hand-authored regression case. min/max comprehensions used to be tagged with
# ACOperatorKind::Sum as their skip_operator (a deliberate but wrong simplification, per a
# comment claiming "AC operator doesn't matter for non-boolean aggregates") -- expand_native.rs's
# leaf-level "drop AC identities" optimisation then silently dropped any element that happened to
# evaluate to exactly 0 (Sum's identity), even with no guard at all. Both cases below are built so
# that 0 is the extreme value being sought (the min/max respectively): if 0 were wrongly dropped,
# `m` would come out 1 instead of 0, and `mx` would come out -1 instead of 0. The max case also
# exercises a constant-foldable guard (i != -3), which must still correctly exclude i=-3.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "native"
heuristic = "x"
solver = "minion"
number-of-solutions = "all"
