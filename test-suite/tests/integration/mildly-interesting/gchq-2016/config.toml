# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "c"
solver = ["minion", "sat"]
# Enumerate all solutions to check that the puzzle has a unique solution.
number-of-solutions = "all"

[solver-options.sat]
heuristic = "c"
channelling = "uniform"
