# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Uniform SAT acceptance and regression runs use TEST_CASE_TIMEOUT=180.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "z3", "sat"]
number-of-solutions = "all"

channelling = "uniform"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
