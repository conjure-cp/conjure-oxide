# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
heuristic = "f"
skip-conjure-validation = "Conjure cannot parse Conjure Oxide's set (representation explicit) representation annotation"
number-of-solutions = 1

[solver-options.sat]
heuristic = "c"
channelling = "uniform"
