# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
heuristic = "f"
number-of-solutions = "all"
skip-conjure-validation = "Conjure does not support occurrence representation for a set of sets"

[solver-options.sat]
heuristic = "c"
channelling = "uniform"
