# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# Acceptance and regression runs use TEST_CASE_TIMEOUT=120.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "all"

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
