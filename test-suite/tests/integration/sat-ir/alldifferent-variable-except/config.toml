# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "all"
channelling = "uniform"
heuristic = "x"
skip-conjure-validation = "Conjure/Savile Row requires a constant scalar exception; independently enumerate every assignment."

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
