# SAT coverage survey: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
# SAT acceptance verified with TEST_CASE_TIMEOUT=600.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
solver = ["sat"]
number-of-solutions = "all"
skip-conjure-validation = "Conjure/Savile Row drops masked negative-exponent assignments; independently enumerate all 30 assignments."

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
