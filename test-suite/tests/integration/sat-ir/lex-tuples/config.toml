# Full SAT acceptance: TEST_CASE_TIMEOUT=600; process-tree RSS ceiling 4 GiB.
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "all"
skip-conjure-validation = "Conjure crashes in rule_FlattenLex on lex over matrices of tuples; solution counts checked by enumeration."

[solver-options.sat]
heuristic = "x"
channelling = "uniform"
