parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
# Oxide's Minion dominance injection currently rejects these compound sum comparisons.
# The 20 nondominated assignments are checked by independent enumeration.
solver = "sat"
skip-conjure-validation = "Conjure does not support CDP"
number-of-solutions = "all"
channelling = "uniform"
heuristic = "x"
