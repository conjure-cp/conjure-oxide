parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
heuristic = "f"
number-of-solutions = "all"
skip-conjure-validation = "Conjure does not accept a representation attribute on int domains"
trace-level = "none"

[solver-options.sat]
heuristic = "c"
