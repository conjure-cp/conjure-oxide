
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "z3", "sat"]
skip-conjure-validation = "Conjure does not expose intermediate optimisation solutions"
number-of-solutions = 1
keep-intermediate-solutions = true
channelling = "uniform"
heuristic = "x"

[solver-options.sat]
trace-level = "aggregate"
heuristic = "x"
channelling = "uniform"
