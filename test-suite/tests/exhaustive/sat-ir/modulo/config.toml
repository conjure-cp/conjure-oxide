
parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
heuristic = "x"
channelling = "uniform"
# Floor modulo differs from Z3's Euclidean remainder for negative divisors.
solver = ["minion", "sat"]
number-of-solutions = "all"

[solver-options.sat]
trace-level = "aggregate"
heuristic = "x"
channelling = "uniform"
