parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["sat"]
number-of-solutions = "all"
channelling = "uniform"
heuristic = "x"
skip-conjure-validation = "Conjure/Savile Row requires a constant scalar exception; independently enumerate whole-value lookups and masked/defaulted results."

[solver-options.sat]
trace-level = "aggregate"
heuristic = "x"
channelling = "uniform"
