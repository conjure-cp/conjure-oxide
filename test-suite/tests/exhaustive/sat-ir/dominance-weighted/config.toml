parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
# Compound dominance comparisons currently fail in Oxide's Minion injection.
# Independently enumerated sparse domains have five nondominated assignments.
solver = ["sat"]
skip-conjure-validation = "Conjure does not support CDP"
number-of-solutions = "all"
channelling = "uniform"
heuristic = "x"

[solver-options.sat]
trace-level = "aggregate"
heuristic = "x"
channelling = "uniform"
