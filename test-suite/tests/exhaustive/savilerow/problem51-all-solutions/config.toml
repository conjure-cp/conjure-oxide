parser = "tree-sitter"
rewriter = "optimised"
comprehension-expander = "auto"
solver = ["minion", "sat"]
number-of-solutions = "all"

# Uniform SAT objective portfolios; the parameter instance has optimum 11.
channelling = "uniform"
heuristic = "x"

[solver-options.sat]
trace-level = "aggregate"
heuristic = "x"
channelling = "uniform"
